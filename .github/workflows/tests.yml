# Run the whole test suite on every push, against a real PostgreSQL service container.
# REQUIRE_TEST_DATABASE and REQUIRE_BICEP turn "skipped because the database / Bicep CLI is missing"
# into failures, so a green run means every test actually ran.
name: Tests

on:
  push:
    branches: [main, sudaiv-work]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workforce
          POSTGRES_DB: workforce_test
          # Not a secret: this database only exists for the length of the job and only the job can
          # reach it. It needs a password (not `trust` auth) because tests/test_reporting.py checks
          # that a reset password stops working.
          POSTGRES_PASSWORD: ci-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workforce -d workforce_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workforce:ci-throwaway@localhost:5432/workforce_test
      TEST_DATABASE_URL: postgresql+psycopg://workforce:ci-throwaway@localhost:5432/workforce_test
      REQUIRE_TEST_DATABASE: "1"
      REQUIRE_BICEP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Install the Bicep CLI (for the Azure template tests)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep

      - run: pytest -q
