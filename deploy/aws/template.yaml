AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Workforce Identity & Lifecycle Analytics: on-demand demo environment. One EC2 instance runs the API
  and Streamlit containers; PostgreSQL runs on RDS in private subnets. Sized for the AWS free tier:
  no load balancer, no NAT gateway, no Secrets Manager. Created and deleted by scripts/aws_deploy.py.

Parameters:
  ProjectName:
    Type: String
    Default: workforce
    AllowedPattern: "[a-z][a-z0-9-]{1,20}"
    Description: Prefix for resource names, the SSM parameter path (/<name>/...) and the log group.
  AllowedCidr:
    Type: String
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/32"
    ConstraintDescription: a single IPv4 address, e.g. 203.0.113.7/32
    Description: The only address allowed to reach the console and the API (your public IP, /32).
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: t3.micro is free-tier eligible. t3.small has more memory but uses credits faster.
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t3.micro]
    Description: Both are free-tier eligible (single-AZ, 20 GB).
  DBEngineVersion:
    Type: String
    Default: "16.15"
    AllowedPattern: "16\\.\\d+"
    Description: >-
      PostgreSQL 16, matching local development. aws_deploy.py passes RDS's current default 16.x,
      since RDS retires old minor versions.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 (x86_64), looked up when the stack is created.

Resources:
  # --- network: one public subnet for the instance, two private subnets for RDS -----------------
  # RDS needs a subnet group spanning two availability zones. The private subnets have no route to
  # the internet, so no NAT gateway is needed (and none is paid for).
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref ProjectName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Ref ProjectName }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-db-a" }]

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-db-b" }]

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the workforce database
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]

  # --- security groups --------------------------------------------------------------------------
  # Only your IP can reach the console and the API. There is no SSH port: shell access goes through
  # SSM Session Manager, which needs no inbound rule and no key pair.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit console and API, reachable from one IP address
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8501, ToPort: 8501, CidrIp: !Ref AllowedCidr, Description: Streamlit console }
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, CidrIp: !Ref AllowedCidr, Description: API }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-app" }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the app instance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: App instance
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-db" }]

  # --- database -----------------------------------------------------------------------------------
  # The master password is generated by scripts/aws_deploy.py and stored as an SSM SecureString;
  # CloudFormation resolves it at deploy time, so it never appears in the template or stack parameters.
  # Backups are off and the database is deleted with the stack: the data is synthetic and reloadable.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBName: workforce
      MasterUsername: workforce
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${ProjectName}/db-password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      AutoMinorVersionUpgrade: true
      Tags: [{ Key: Name, Value: !Ref ProjectName }]

  # --- storage and logs ---------------------------------------------------------------------------
  # Holds the release (a `git archive` of the committed code) and the generated CSV files.
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags: [{ Key: Name, Value: !Ref ProjectName }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/${ProjectName}"
      RetentionInDays: 7

  # --- instance and its permissions ---------------------------------------------------------------
  # Least privilege: read this bucket, read this project's SSM parameters, write to this log group,
  # plus the AWS managed policy that lets SSM Session Manager and Run Command reach the instance.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: workforce-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required # IMDSv2 only
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: !Ref ProjectName }]
      # First boot: install Docker, add swap, then wait for the release in S3 and start it.
      # Everything after that lives in deploy/aws/start.sh, inside the release.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Non-secret settings for start.sh. Secrets are read from SSM by start.sh itself.
          cat > /etc/workforce.env <<EOF
          AWS_REGION=${AWS::Region}
          BUCKET=${DataBucket}
          LOG_GROUP=${LogGroup}
          PARAM_PREFIX=/${ProjectName}
          DB_HOST=${Database.Endpoint.Address}
          DB_NAME=workforce
          DB_USER=workforce
          EOF

          dnf install -y docker
          systemctl enable --now docker

          # Building the image and running two Python apps is tight on 1 GB of memory.
          dd if=/dev/zero of=/swapfile bs=1M count=1024
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo "/swapfile none swap sw 0 0" >> /etc/fstab

          # Fetch the latest release from S3 and start it. Also run by `aws_deploy.py push`
          # through SSM Run Command.
          cat > /usr/local/bin/workforce-release <<'EOF'
          #!/bin/bash
          set -euo pipefail
          source /etc/workforce.env
          until aws s3api head-object --bucket "$BUCKET" --key release/app.tar.gz >/dev/null 2>&1; do
            echo "Waiting for s3://$BUCKET/release/app.tar.gz"
            sleep 15
          done
          rm -rf /opt/workforce/release
          mkdir -p /opt/workforce/release
          aws s3 cp "s3://$BUCKET/release/app.tar.gz" - | tar -xz -C /opt/workforce/release
          exec bash /opt/workforce/release/deploy/aws/start.sh
          EOF
          chmod 755 /usr/local/bin/workforce-release
          /usr/local/bin/workforce-release

Outputs:
  ConsoleUrl:
    Description: Streamlit console (reachable from AllowedCidr only)
    Value: !Sub "http://${AppInstance.PublicDnsName}:8501"
  ApiDocsUrl:
    Description: API documentation
    Value: !Sub "http://${AppInstance.PublicDnsName}:8000/docs"
  HealthUrl:
    Value: !Sub "http://${AppInstance.PublicDnsName}:8000/health"
  InstanceId:
    Value: !Ref AppInstance
  BucketName:
    Value: !Ref DataBucket
  LogGroupName:
    Value: !Ref LogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
