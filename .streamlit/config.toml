# Dark theme modelled on Microsoft 365 (Fluent 2 web dark tokens): neutral greys, one blue accent,
# Segoe UI, small corner radius. Chart colours are set in streamlit_app/ui.py.
[theme]
base = "dark"
primaryColor = "#2886DE"
backgroundColor = "#1F1F1F"
secondaryBackgroundColor = "#292929"
textColor = "#FFFFFF"
linkColor = "#479EF5"
borderColor = "#3D3D3D"
dataframeBorderColor = "#333333"
dataframeHeaderBackgroundColor = "#262626"
showWidgetBorder = true
font = "'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif"
baseFontSize = 14
headingFontSizes = ["1.75rem", "1.25rem", "1rem"]
headingFontWeights = 600
baseRadius = "4px"
buttonRadius = "4px"
# Fluent status colours (dark): used by success, warning, error and info messages.
redColor = "#DC626D"
orangeColor = "#F7630C"
yellowColor = "#F2C661"
greenColor = "#54B054"
blueColor = "#479EF5"
grayColor = "#8A8A8A"

[theme.sidebar]
backgroundColor = "#141414"
secondaryBackgroundColor = "#242424"

[client]
toolbarMode = "minimal"

[server]
headless = true
# Local development only listens on this machine. The container passes --server.address=0.0.0.0.
address = "localhost"

[browser]
gatherUsageStats = false
